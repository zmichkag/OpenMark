services:
  rovnomark:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: rovnomark-app-test
    command: ["/bin/marking-service", "--port", "8000", "--debug", "--data-dir", "/app/data"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ./data:/app/data
      # Если нужно монтировать кастомный UI:
      - ./ui2:/app/ui2
    logging:
      driver: "json-file"
      options:
        tag: "{{.Name}}"
        max-size: "50m"
        max-file: "3"